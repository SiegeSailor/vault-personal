<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">

  <title>Node Chat Client</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <link rel="stylesheet" href="./styles.css">

  <!-- Scripts -->
  <script>
    delete module.exports
  </script>
  <script src="https://code.jquery.com/jquery-3.2.1.js"></script>
  <script src="./window.js" charset="utf-8"></script>

</head>

<body>
  <div id="container" class="container-fluid">

    <!-- Input row -->
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 ">
        <h3 class="text-heading" id="client-id">Hello Client</h3>
        <h4 class="text-heading">Send Message</h4>
        <input type="text" id="text-input" class="form-control text-input" placeholder="Enter message to send..."></input>
      </div>
    </div>

    <!-- Output row -->
    <div class="row">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <h3 class="text-heading">Send Log</h3>
        <pre id="text-output1" class="text-output"> </pre>
      </div>
    </div>

    <div class="row">
      <div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">
        <h3 class="text-heading">Received Log</h3>
        <pre id="text-output2" class="text-output"> </pre>
      </div>
    </div>

  </div>
</body>

</html>
